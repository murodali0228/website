{% extends 'base.html' %}
{% block title %}
    subject
{% endblock %}

{% block content %}
<h1>
    Barcha fanlar royxati:
</h1>
<ol>
    {% for subject in subjects %}
        <li>
            <a href="{% url 'detail_subject' subject.pk %}">
                {{ subject.subject }}
            </a>
            {{ subject.student.first_name }}
            {{ subject.student.last_name }}
            {{ subject.ball }}
        </li>
    {% endfor %}
</ol>
{% endblock %}
