{% extends 'base.html' %}
{% block title %}
    Students
{% endblock %}

{% block content%}
<h1>
    Barcha Studentlar royxati:
</h1>
<form>
    <input type="search" name="search" value="{{ search }}" >
    <button>
        search
    </button>
</form>
<ol>
    {% for student in students %}
        <li>
            {{ student.first_name }}
            {{ student.last_name }}
            {{ student.age }}
        </li>
    {% empty %}
        <h4>
            ma'lumot topilmadi !
        </h4>
    {% endfor %}
</ol>
{% endblock %}
